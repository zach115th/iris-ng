{# Styles + behaviour for the global notifications bell. Include ONCE per
   navigation template, OUTSIDE the topbar <ul> (a <style> inside a <ul> is
   invalid placement - project rule). Vanilla JS: navs render before jQuery. #}
{% if current_user.is_authenticated %}
<style>
.iris-gnotif-badge {
	position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px;
	padding: 0 4px; border-radius: 8px; background: #8b5cf6; color: #fff;
	font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
}
.iris-gnotif-panel {
	width: 400px; max-width: 92vw; padding: 0; border: 1px solid rgba(139, 92, 246, 0.35);
	border-radius: 8px; background: #17171c; overflow: hidden;
}
.iris-gnotif-head {
	display: flex; align-items: center; justify-content: space-between;
	padding: 12px 14px; border-bottom: 1px solid rgba(139, 92, 246, 0.22);
}
.iris-gnotif-title { color: #e8e6f0; font-size: 13px; font-weight: 600; letter-spacing: .3px; }
.iris-gnotif-sub { color: #8a8798; font-size: 11px; margin-top: 2px; }
.iris-gnotif-ack {
	border: 1px solid rgba(139, 92, 246, 0.35); background: rgba(139, 92, 246, 0.12);
	color: #d4c4ff; font-size: 11px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
}
.iris-gnotif-ack:disabled { opacity: .4; cursor: default; }
.iris-gnotif-ack:not(:disabled):hover { background: rgba(139, 92, 246, 0.22); }
.iris-gnotif-body { max-height: 400px; overflow-y: auto; }
.iris-gnotif-row {
	display: flex; gap: 10px; padding: 10px 14px; cursor: pointer;
	border-bottom: 1px solid rgba(255, 255, 255, 0.04); text-decoration: none;
}
.iris-gnotif-row:hover { background: rgba(139, 92, 246, 0.08); text-decoration: none; }
.iris-gnotif-row:last-child { border-bottom: none; }
.iris-gnotif-row.read { opacity: .55; }
.iris-gnotif-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: #8b5cf6; }
.iris-gnotif-dot.mention { background: #8b5cf6; }
.iris-gnotif-dot.task_assigned { background: #fb6340; }
.iris-gnotif-dot.case_assigned, .iris-gnotif-dot.case_updated_own { background: #5e72e4; }
.iris-gnotif-dot.alert_assigned, .iris-gnotif-dot.alert_escalated { background: #f5365c; }
.iris-gnotif-text { color: #d8d6e0; font-size: 12px; line-height: 1.4; word-break: break-word; }
.iris-gnotif-meta { color: #7e7b8c; font-size: 10.5px; margin-top: 3px; }
.iris-gnotif-empty { padding: 24px 14px; text-align: center; color: #7e7b8c; font-size: 12px; }
.iris-gnotif-foot {
	padding: 8px 14px; border-top: 1px solid rgba(139, 92, 246, 0.22);
	font-size: 10.5px; text-align: center;
}
.iris-gnotif-foot a { color: #b9a6f0; }
.iris-follow-star {
	margin-left: 8px; font-size: 15px; color: #8a8798; text-decoration: none;
	vertical-align: 1px;
}
.iris-follow-star:hover { color: #d4c4ff; text-decoration: none; }
.iris-follow-star.following { color: #f4c430; }
.iris-follow-btn.following { background: rgba(139, 92, 246, 0.22); color: #d4c4ff; }
.iris-follow-btn.following .iris-fb-star { color: #f4c430; }
</style>
<script>
/* Global addressed-to-me bell. Polls the unread count every 60s; the list
   loads on first open. Clicking a row marks it read and follows its URL.
   Vanilla JS on purpose - this include renders before jQuery loads. */
(function () {
	var POLL_MS = 60000;
	var loaded = false;

	function el(id) { return document.getElementById(id); }
	function esc(s) {
		var d = document.createElement('div');
		d.textContent = s == null ? '' : String(s);
		return d.innerHTML;
	}
	function csrf() {
		var t = document.getElementById('csrf_token');
		return t ? t.value : '';
	}
	function relTime(iso) {
		if (!iso) { return ''; }
		var then = new Date(iso).getTime();
		if (isNaN(then)) { return ''; }
		var secs = Math.floor((Date.now() - then) / 1000);
		if (secs < 60) { return 'just now'; }
		if (secs < 3600) { return Math.floor(secs / 60) + 'm ago'; }
		if (secs < 86400) { return Math.floor(secs / 3600) + 'h ago'; }
		if (secs < 2592000) { return Math.floor(secs / 86400) + 'd ago'; }
		return new Date(iso).toISOString().slice(0, 10);
	}

	function setBadge(count) {
		var badge = el('iris-gnotif-badge');
		if (!badge) { return; }
		if (count > 0) {
			badge.textContent = count > 99 ? '99+' : String(count);
			badge.style.display = '';
		} else {
			badge.style.display = 'none';
		}
		var ack = el('iris-gnotif-ack');
		if (ack) { ack.disabled = count === 0; }
	}

	function pollCount() {
		fetch('/api/v2/notifications/count', { credentials: 'same-origin' })
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (j) { if (j) { setBadge(j.unread || 0); } })
			.catch(function () { /* transient - keep last badge */ });
	}

	function render(list) {
		var body = el('iris-gnotif-body');
		if (!body) { return; }
		if (!list.length) {
			body.innerHTML = '<div class="iris-gnotif-empty">Nothing addressed to you.</div>';
			return;
		}
		body.innerHTML = list.map(function (n) {
			return '<a class="iris-gnotif-row' + (n.is_read ? ' read' : '') + '"'
				+ ' data-id="' + n.id + '" data-url="' + esc(n.url || '') + '" href="#">'
				+ '<span class="iris-gnotif-dot ' + esc(n.event_type) + '"></span>'
				+ '<span><span class="iris-gnotif-text">' + esc(n.title) + '</span>'
				+ '<div class="iris-gnotif-meta">' + relTime(n.created_at) + '</div></span>'
				+ '</a>';
		}).join('');
	}

	function loadList() {
		fetch('/api/v2/notifications?per_page=25', { credentials: 'same-origin' })
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (j) {
				if (!j) { return; }
				loaded = true;
				render(j.notifications || []);
				setBadge(j.unread || 0);
			})
			.catch(function () {});
	}

	function markRead(id, cb) {
		fetch('/api/v2/notifications/' + id + '/read', {
			method: 'POST', credentials: 'same-origin',
			headers: { 'Content-Type': 'application/json' },
			/* csrf_token MUST be in the BODY (project rule). */
			body: JSON.stringify({ csrf_token: csrf() })
		}).then(function () { if (cb) { cb(); } }).catch(function () { if (cb) { cb(); } });
	}

	document.addEventListener('DOMContentLoaded', function () {
		if (!el('iris-gnotif-item')) { return; }
		pollCount();
		setInterval(pollCount, POLL_MS);

		el('iris-gnotif-bell').addEventListener('click', function () { loadList(); });

		el('iris-gnotif-body').addEventListener('click', function (ev) {
			var row = ev.target.closest ? ev.target.closest('.iris-gnotif-row') : null;
			if (!row) { return; }
			ev.preventDefault();
			var url = row.getAttribute('data-url');
			markRead(row.getAttribute('data-id'), function () {
				if (url) { window.location.href = url; } else { loadList(); }
			});
		});

		el('iris-gnotif-ack').addEventListener('click', function () {
			fetch('/api/v2/notifications/read-all', {
				method: 'POST', credentials: 'same-origin',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ csrf_token: csrf() })
			}).then(function () { loadList(); }).catch(function () {});
		});
	});

	/* Follow stars (case chip in the topbar; alert rows get theirs from
	   alert_follow.js which shares these classes). Delegated so both work. */
	function setStar(star, following) {
		star.textContent = following ? '★' : '☆';
		star.classList.toggle('following', !!following);
		star.title = following ? 'Unfollow' : 'Follow';
	}

	window.irisFollowSetStar = setStar;

	/* v3-style Follow BUTTON (star + follower count + label) - the case
	   header hosts one; any page can. */
	function refreshFollowBtn(btn) {
		var ot = btn.getAttribute('data-object-type');
		var oid = btn.getAttribute('data-object-id');
		fetch('/api/v2/follow/count?object_type=' + ot + '&object_id=' + oid,
			{ credentials: 'same-origin' })
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (j) {
				if (!j) { return; }
				btn.classList.toggle('following', !!j.following);
				btn.querySelector('.iris-fb-star').innerHTML = j.following ? '&#9733;' : '&#9734;';
				btn.querySelector('.iris-fb-cnt').textContent = String(j.count);
				btn.querySelector('.iris-fb-lbl').textContent = j.following ? 'Following' : 'Follow';
			}).catch(function () {});
	}

	document.addEventListener('DOMContentLoaded', function () {
		document.querySelectorAll('.iris-follow-btn').forEach(refreshFollowBtn);
		document.addEventListener('click', function (ev) {
			var btn = ev.target.closest ? ev.target.closest('.iris-follow-btn') : null;
			if (!btn) { return; }
			ev.preventDefault();
			var ot = btn.getAttribute('data-object-type');
			var oid = parseInt(btn.getAttribute('data-object-id'), 10);
			if (btn.classList.contains('following')) {
				fetch('/api/v2/follow?object_type=' + ot + '&object_id=' + oid,
					{ method: 'DELETE', credentials: 'same-origin' })
					.then(function () { refreshFollowBtn(btn); }).catch(function () {});
			} else {
				fetch('/api/v2/follow', {
					method: 'POST', credentials: 'same-origin',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ object_type: ot, object_id: oid,
										   csrf_token: csrf() })
				}).then(function () { refreshFollowBtn(btn); }).catch(function () {});
			}
		});

		document.addEventListener('click', function (ev) {
			var star = ev.target.closest ? ev.target.closest('.iris-follow-star') : null;
			if (!star) { return; }
			ev.preventDefault();
			var ot = star.getAttribute('data-object-type');
			var oid = parseInt(star.getAttribute('data-object-id'), 10);
			var following = star.classList.contains('following');
			if (following) {
				fetch('/api/v2/follow?object_type=' + ot + '&object_id=' + oid,
					{ method: 'DELETE', credentials: 'same-origin' })
					.then(function () { setStar(star, false); }).catch(function () {});
			} else {
				fetch('/api/v2/follow', {
					method: 'POST', credentials: 'same-origin',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ object_type: ot, object_id: oid,
										   csrf_token: csrf() })
				}).then(function (r) {
					if (r.ok) { setStar(star, true); }
				}).catch(function () {});
			}
		});
	});
})();
</script>
{% endif %}
