## @section Iris AI Worker Configuration
##
## Consumes the dedicated `ai_queue` at concurrency 1 (one model call in flight at
## a time). WITHOUT this deployment the executive case summary and case chat enqueue
## jobs that are never consumed - the UI shows them queued forever rather than
## reporting an error, while every non-AI feature works normally.
irisaiworker:
  ## @param irisaiworker.enabled Deploy the AI worker
  ##
  enabled: true
  ## @param irisaiworker.app Iris AI Worker App
  ##
  app: iriswebapp-ai-worker
  ## @param irisaiworker.name Iris AI Worker Name
  ##
  name: iriswebapp-ai-worker
  ## @param irisaiworker.image Iris AI Worker Image
  ##
  ## Same image as irisapp - the entrypoint target selects the role.
  image: ghcr.io/zach115th/iriswebapp_app
  ## @param irisaiworker.tag Iris AI Worker Tag
  ##
  ## Empty = follow the chart's appVersion, which is the release this chart
  ## shipped with. Pinning here is supported but rarely wanted: the images for
  ## a release only exist once its tag has built, so a hardcoded pin can only be
  ## corrected after the fact — which is how the chart packaged into
  ## IRIS-NG-v1.0.0 ended up pinning the previous release's images.
  tag: ""
  ## @param irisaiworker.imagePullPolicy Iris AI Worker imagePullPolicy
  ##
  imagePullPolicy: "IfNotPresent"
  ## @param irisaiworker.replicaCount Iris AI Worker replicaCount
  ##
  ## Keep at 1. Concurrency is bounded to one model call per worker on purpose;
  ## scaling this up multiplies concurrent load on the AI backend.
  replicaCount: 1
  ## @param irisaiworker.resources Resources for irisaiworker
  ##
  resources: {}

  ## @param  Iris AI Worker Environments
  ##
  POSTGRES_USER: raptor
  POSTGRES_PASSWORD: postgres
  POSTGRES_ADMIN_USER: raptor
  POSTGRES_ADMIN_PASSWORD: postgres
  POSTGRES_PORT: 5432
  POSTGRES_SERVER: postgres
  IRIS_SECRET_KEY: AVerySuperSecretKey-SoNotThisOne
  IRIS_SECURITY_PASSWORD_SALT: ARandomSalt-NotThisOneEither
  ## @param irisaiworker.securityContext securityContext for irisaiworker
  ##
  securityContext: {}
  ## @param irisaiworker.podSecurityContext podSecurityContext for irisaiworker
  ##
  podSecurityContext: {}

## @section TLS material
##
## The app and worker templates mount four Secrets built from files under
## charts/certificates/ via .Files.Glob. That directory is NOT shipped with the
## chart, so with this disabled (the default) those Secrets, volumes and mounts are
## omitted entirely - otherwise the pods reference Secret keys that do not exist and
## never leave ContainerCreating.
##
## Enable only after placing the files under charts/certificates/:
##   rootCA/irisRootCACert.pem, rootCA/*, web_certificates/*, ldap/*
certificates:
  enabled: false

## @section Nginx Ingress Configuration
##
ingress:
  enabled: true
  name: iris-ingress
  className: nginx
  annotations:
    # Add any annotations specific to your Ingress controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    ## CHANGE THIS - the hostname you will point at the ingress load balancer.
    - host: iris.example.com
      paths:
        - path: /(.*)
          pathType: ImplementationSpecific
          serviceName: iriswebapp-app
          servicePort: 8000
  tls:
    - secretName: iris-ingress-tls-secret
      hosts:
        - iris.example.com
