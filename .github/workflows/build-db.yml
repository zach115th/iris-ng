name: Build and push DB image

on:
  push:
    # Publish semver tags as releases.
    # Both forms: IRIS-NG-v* is the current scheme, v* keeps the older
    # v2.5.0-beta.1+iris-ng.N releases reachable by re-dispatch.
    tags: [ 'IRIS-NG-v*.*.*', 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-db:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - run: |
          echo "The job was automatically triggered by a ${{ github.event_name }} event."
          echo "This job is now running on a ${{ runner.os }} server hosted by github!"
          echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Publish under the owner of whichever repo this runs in, not the
          # hardcoded upstream org. GITHUB_TOKEN can only write packages for
          # its own owner, so a fork pushing to dfir-iris/ fails with
          # "denied: permission_denied: The requested installation does not exist".
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iriswebapp_db

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/db
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }} # Don't push on PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max