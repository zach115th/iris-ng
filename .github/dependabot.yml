version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"     # publishes force-push a fresh history
    assignees: ["zach115th"]
    labels: ["dependencies", "github-actions", "apply-in-iris-next"]
    commit-message: { prefix: "chore", include: "scope" }
    ignore:
      # Deliberately held at node20 majors: download-artifact v8 stops
      # unzipping (breaks the upload-tar -> docker load pattern) and
      # ruff-action v3+ resolves its version from pyproject.toml.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astral-sh/ruff-action"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories: ["/source", "/tests"]
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees: ["zach115th"]
    labels: ["dependencies", "python", "apply-in-iris-next"]
    commit-message: { prefix: "chore", include: "scope" }
    ignore:
      # DOCX reporter stack is frozen: the vendored docx_generator-0.8.0
      # wheel hard-pins these, and bumping them breaks report generation.
      - dependency-name: "docxcompose"
      - dependency-name: "python-docx"
      - dependency-name: "docxtpl"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories: ["/ui", "/e2e"]
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees: ["zach115th"]
    labels: ["dependencies", "javascript", "apply-in-iris-next"]
    commit-message: { prefix: "chore", include: "scope" }
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/docker/db", "/docker/nginx", "/docker/webApp", "/.devcontainer"]
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    assignees: ["zach115th"]
    labels: ["dependencies", "docker", "apply-in-iris-next"]
    commit-message: { prefix: "chore", include: "scope" }
