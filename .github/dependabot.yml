version: 2

updates:
  # ------------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Publishing force-pushes a fresh single-commit history, so a PR's base
    # stops being an ancestor of main. Rebase attempts cannot succeed.
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # GitHub removed Node 20 from its runners on 2026-09-23, so the artifact
      # actions moved to their node24 majors (upload-artifact v7, download-artifact
      # v7, ruff-action v4). download-artifact v8 stops unzipping artifacts by
      # default and makes a digest mismatch an error; ci.yml's (disabled) test jobs
      # download the image tarballs with `pattern:` + `merge-multiple`, so take v8
      # deliberately, together with those jobs.
      - dependency-name: "actions/download-artifact"
        versions: [">=8"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Python
  - package-ecosystem: "pip"
    directories:
      - "/source"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The vendored docx_generator-0.8.0 wheel hard-pins python-docx and
      # docxtpl, and moving either changes the reports it writes: they move
      # with the report-stack slice, checked by comparing rendered reports.
      # docxcompose is no longer frozen: the wheel's pin was relaxed to
      # >=1.1.2, and requirements.txt pins it.
      - dependency-name: "python-docx"
      - dependency-name: "docxtpl"
      # graphene 3.4.3 (the newest) requires graphql-core<3.3, so a 3.3 bump is
      # UNINSTALLABLE here. requirements.txt pins graphql-core because the
      # /graphql view uses it directly. Lift this once a graphene release
      # accepts 3.3.
      - dependency-name: "graphql-core"
        versions: [">=3.3.0"]
      # A marshmallow major is a migration of every schema, not a bump: 4.x
      # removed arguments, changed how fields dump and parse, and came with
      # flask-marshmallow 1.5 (which gives auto schemas the database session -
      # IRIS keeps its placeholder, app/schema/schema_base.py). A 5.x moves the
      # same way, as its own slice with a contract probe of every schema.
      - dependency-name: "marshmallow"
        update-types: ["version-update:semver-major"]
      # python-dateutil 3.x is UNINSTALLABLE here: graphene 3.4.3 (the newest,
      # behind graphene-sqlalchemy and /graphql) requires python-dateutil<3, so
      # pip reports ResolutionImpossible (Dependabot #155's app image build
      # failed on it). Lift this once a graphene release accepts 3.x. IRIS itself
      # uses only dateutil.parser; 3.0 mainly rewrites dateutil.tz.
      - dependency-name: "python-dateutil"
        versions: [">=3.0.0"]
      # pymisp 3.0 requires python-dateutil>=3.0.0, so it is UNINSTALLABLE here
      # (Dependabot #184's app image build failed on it): this project pins
      # python-dateutil 2.9.0.post0 because graphene 3.4.3 (the newest, behind
      # /graphql) requires python-dateutil<3 - the python-dateutil ignore above.
      # celery 5.7.0 pins python-dateutil==2.9.0.post0 as well, so pymisp 3 also
      # waits for a celery 5.7.x that relaxes that pin. 2.5.x updates still come
      # through. Lift this together with the python-dateutil one.
      - dependency-name: "pymisp"
        versions: [">=3.0.0"]
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- npm (UI + e2e)
  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # jQuery 4 removes APIs used in ~86 places here (.bind, $.proxy, $.trim,
      # $.isFunction, ...), and bootstrap@4 declares peer jquery "1.9.1 - 3".
      # Nothing fails at build time: the bundle ships and pages break one
      # interaction at a time. Migrating means Bootstrap 4 -> 5 first.
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jquery"
        update-types: ["version-update:semver-major"]
      # @types/node should describe the Node actually in use (24 LTS), not the
      # newest published. Bumping it independently gives editor autocomplete for
      # APIs the runtime does not have. Move it with the Node LTS bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A Chart.js major is a migration, not a bump: 2.x -> 4.x renamed or removed
      # nearly every option the charts here set (Metrics, Inventory, custom
      # dashboards), and a static-copy source vite.config.js names that a release
      # no longer ships (dist/chart.umd.min.js) is skipped silently, so the library
      # just disappears from dist. 4.x minors and patches update normally; a major
      # moves with its own slice, each chart compared before / after.
      - dependency-name: "chart.js"
        update-types: ["version-update:semver-major"]
      # Bootstrap 5 is a migration, not a bump: vite.config.js copies its
      # bootstrap.min.js into every page, and 5 reads only data-bs-* attributes
      # (the templates carry ~119 data-toggle, ~140 data-dismiss, ~51
      # data-backdrop), needs @popperjs/core 2 where the pages load popper.js 1,
      # and pairs with Bootstrap 5 CSS where the pages load 4's. The build stays
      # green and every modal close button, toggle and dropdown stops working.
      # It moves with its own migration (the BS4-coupled plugins first, then a
      # codemod and a theme). 4.6.x has no open advisory.
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Base images
  - package-ecosystem: "docker"
    directories:
      - "/docker/db"
      - "/docker/nginx"
      - "/docker/tunnel"
      - "/docker/webApp"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # A Postgres major is a data migration, not a dependency bump: a pg18
      # server will not start on a pg17 data directory, so every existing
      # install crash-loops. Do it deliberately, with a migrate script, the
      # way pg12 -> pg17 was handled. (Closes PR #44.)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Interpreter upgrade wearing a tag bump. This image carries the
      # vendored report stack and pinned wheels, and an import failure in them
      # only surfaces at app boot - a green build proves nothing.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The devcontainer must run the interpreter the app image ships
      # (docker/webApp: python:3.12-slim); the header of .devcontainer/Dockerfile
      # says why. The "python" rule above does not match this image's name, so
      # Dependabot proposed 3.13 (#46) and 3.15 (#157) anyway. Move it by hand,
      # together with docker/webApp's python.
      - dependency-name: "devcontainers/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node majors alternate: odd releases (23, 25, 27) never get an LTS phase
      # and reach EOL in ~6 months -- Node 25 was ALREADY end-of-life when it was
      # first proposed. Node is build-time only here (the runtime image has no
      # node binary) and major bumps produce byte-identical bundles, so tracking
      # Current buys nothing. Move deliberately to the next LTS, together with
      # node-version in ci.yml and @types/node in e2e.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------------- Compose images
  # The message broker is named only in the compose files, which the docker
  # ecosystem above never reads: rabbitmq sat on 3.13 for over a year after its
  # community support ended (2024-09). Keep deploy/kubernetes/charts/values.yaml's
  # rabbitmq.tag equal to it by hand - Dependabot's helm support reads
  # repository/tag pairs, and the chart's rabbitmq.image/tag keys are not that.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # A RabbitMQ major removes deprecated features and changes feature flags;
      # move it deliberately (Celery's use of each deprecated feature checked
      # with `rabbitmq-diagnostics check_if_any_deprecated_features_are_used`).
      - dependency-name: "rabbitmq"
        update-types: ["version-update:semver-major"]
      # Build-time only, as in the docker ecosystem above: move to the next LTS
      # deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
