version: 2

updates:
  # ------------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Publishing force-pushes a fresh single-commit history, so a PR's base
    # stops being an ancestor of main. Rebase attempts cannot succeed.
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Held at node20 majors deliberately: download-artifact v8 stops
      # unzipping (breaks the upload-tar -> docker load pattern in ci.yml),
      # and ruff-action v3+ resolves its version from pyproject.toml.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astral-sh/ruff-action"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Python
  - package-ecosystem: "pip"
    directories:
      - "/source"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The DOCX reporter stack is frozen: the vendored
      # docx_generator-0.8.0 wheel hard-pins these, and bumping any of them
      # breaks report generation.
      - dependency-name: "docxcompose"
      - dependency-name: "python-docx"
      - dependency-name: "docxtpl"
      # flask-marshmallow 1.5.0+ requires marshmallow>=4.0.0 while this project
      # pins marshmallow 3.x, so the bump is UNINSTALLABLE, not merely risky --
      # it fails resolution at image build. 1.4.0 is the last release that
      # accepts marshmallow 3. Moving to marshmallow 4 is a schema-wide
      # migration across datamgmt/, not a dependency bump.
      - dependency-name: "flask-marshmallow"
        versions: [">=1.5.0"]
      - dependency-name: "marshmallow"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- npm (UI + e2e)
  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # jQuery 4 removes APIs used in ~86 places here (.bind, $.proxy, $.trim,
      # $.isFunction, ...), and bootstrap@4 declares peer jquery "1.9.1 - 3".
      # Nothing fails at build time: the bundle ships and pages break one
      # interaction at a time. Migrating means Bootstrap 4 -> 5 first.
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jquery"
        update-types: ["version-update:semver-major"]
      # @types/node should describe the Node actually in use (24 LTS), not the
      # newest published. Bumping it independently gives editor autocomplete for
      # APIs the runtime does not have. Move it with the Node LTS bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Base images
  - package-ecosystem: "docker"
    directories:
      - "/docker/db"
      - "/docker/nginx"
      - "/docker/webApp"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # A Postgres major is a data migration, not a dependency bump: a pg18
      # server will not start on a pg17 data directory, so every existing
      # install crash-loops. Do it deliberately, with a migrate script, the
      # way pg12 -> pg17 was handled. (Closes PR #44.)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Interpreter upgrade wearing a tag bump. This image carries the
      # pkg_resources shim and the frozen docx stack, and pkg_resources
      # failures only surface at app boot - a green build proves nothing.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node majors alternate: odd releases (23, 25, 27) never get an LTS phase
      # and reach EOL in ~6 months -- Node 25 was ALREADY end-of-life when it was
      # first proposed. Node is build-time only here (the runtime image has no
      # node binary) and major bumps produce byte-identical bundles, so tracking
      # Current buys nothing. Move deliberately to the next LTS, together with
      # node-version in ci.yml and @types/node in e2e.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
