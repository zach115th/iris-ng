version: 2

updates:
  # ------------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Publishing force-pushes a fresh single-commit history, so a PR's base
    # stops being an ancestor of main. Rebase attempts cannot succeed.
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Held at node20 majors deliberately: download-artifact v8 stops
      # unzipping (breaks the upload-tar -> docker load pattern in ci.yml),
      # and ruff-action v3+ resolves its version from pyproject.toml.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astral-sh/ruff-action"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Python
  - package-ecosystem: "pip"
    directories:
      - "/source"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The DOCX reporter stack is frozen: the vendored
      # docx_generator-0.8.0 wheel hard-pins these, and bumping any of them
      # breaks report generation.
      - dependency-name: "docxcompose"
      - dependency-name: "python-docx"
      - dependency-name: "docxtpl"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- npm (UI + e2e)
  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------- Base images
  - package-ecosystem: "docker"
    directories:
      - "/docker/db"
      - "/docker/nginx"
      - "/docker/webApp"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    assignees:
      - "zach115th"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # A Postgres major is a data migration, not a dependency bump: a pg18
      # server will not start on a pg17 data directory, so every existing
      # install crash-loops. Do it deliberately, with a migrate script, the
      # way pg12 -> pg17 was handled. (Closes PR #44.)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Interpreter upgrade wearing a tag bump. This image carries the
      # pkg_resources shim and the frozen docx stack, and pkg_resources
      # failures only surface at app boot - a green build proves nothing.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
