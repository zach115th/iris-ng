worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ANALYTICS_ORIGIN is substituted by envsubst in entrypoint.sh at container
    # start. It MUST be listed in that envsubst allowlist -- an unlisted ${VAR}
    # is emitted literally, producing a malformed CSP that browsers may drop
    # entirely, silently disabling the policy while nginx starts cleanly.
    # Empty by default: no analytics host is allowed unless configured.
    map $request_uri $csp_header {
        default "default-src 'self' ${ANALYTICS_ORIGIN}; script-src 'self' 'unsafe-inline' 'unsafe-eval' ${ANALYTICS_ORIGIN}; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src blob:;";
    }
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log debug;

    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    types_hash_max_size             2048;
    types_hash_bucket_size          128;
    proxy_headers_hash_max_size     2048;
    proxy_headers_hash_bucket_size  128;
    proxy_buffering                 on;
    proxy_buffers                   8 16k;
    proxy_buffer_size               4k;

    client_header_buffer_size   2k;
    large_client_header_buffers 8 64k;
    client_body_buffer_size     64k;
    client_max_body_size        100M;

    reset_timedout_connection   on;
    keepalive_timeout           90s;
    client_body_timeout         90s;
    send_timeout                90s;
    client_header_timeout       90s;
    fastcgi_read_timeout        90s;
    # WORKING TIMEOUT FOR PROXY CONF
    proxy_read_timeout          90s;
    uwsgi_read_timeout          90s;

    # Compression: the v2 IOC list on a module-enriched case is tens of MB
    # of highly repetitive JSON and dominated page load uncompressed.
    # Trade-off, taken deliberately: nginx always compresses text/html once
    # gzip is on (it cannot be excluded via gzip_types), which in principle
    # exposes the CSRF token in HTML pages to BREACH-style size probing.
    # Tokens are time-signed per render and the exposure needs an on-path
    # observer injecting reflected content -- revert to `gzip off` for the
    # stricter posture.
    gzip on;
    gzip_disable "MSIE [1-6]\.";
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript
               text/css image/svg+xml font/ttf
               application/vnd.ms-fontobject text/plain;

    # FORWARD CLIENT IDENTITY TO SERVER
    proxy_set_header    HOST                $http_host;
    proxy_set_header    X-Forwarded-Proto   $scheme;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

    # FULLY DISABLE SERVER CACHE
    add_header          Last-Modified $date_gmt;
    add_header          'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    if_modified_since   off;
    expires             off;
    etag                off;
    proxy_no_cache      1;
    proxy_cache_bypass  1;

    # SSL CONF, STRONG CIPHERS ONLY
    ssl_protocols               TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers   on;
    ssl_certificate             /www/certs/${CERT_FILENAME};
    ssl_certificate_key         /www/certs/${KEY_FILENAME};
    ssl_ecdh_curve              secp521r1:secp384r1:prime256v1;
    ssl_buffer_size             4k;

    # DISABLE SSL SESSION CACHE
    ssl_session_tickets         off;
    ssl_session_cache           none;

    access_log /var/log/nginx/audit_platform_access.log main;
    error_log  /var/log/nginx/audit_platform_error.log debug;

    server {
        listen          ${INTERFACE_HTTPS_PORT} ssl;
        # HTTP/2 multiplexing -- with server caching fully disabled above, every
        # page load re-fetches ~60 assets, which serializes badly over h1's
        # 6-connections-per-host limit. WebSockets are unaffected: browsers
        # open ws:// on a separate HTTP/1.1 connection (nginx does not
        # advertise RFC 8441), so socket.io keeps working.
        http2           on;
        server_name     ${SERVER_NAME};
        root            /www/data;
        index           index.html;
        error_page      500 502 503 504  /50x.html;

        # `always` is load-bearing on every security header -- see the same
        # block in nginx.conf. Without it these apply only to 2xx/3xx, leaving
        # error responses with no CSP, X-Frame-Options or nosniff.
        add_header Content-Security-Policy $csp_header always;

        # SECURITY HEADERS
        add_header X-XSS-Protection             "1; mode=block" always;
        add_header X-Frame-Options              DENY always;
        add_header X-Content-Type-Options       nosniff always;
        # max-age = 31536000s = 1 year
        add_header Strict-Transport-Security    "max-age=31536000: includeSubDomains" always;
        add_header Front-End-Https              on;

        location / {
            proxy_pass http://${IRIS_FRONTEND_SERVER}:${IRIS_FRONTEND_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Origin $http_origin;
        }

        location /api/v2/ {
            proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};

            location ~ ^/(manage/templates/add|manage/cases/upload_files) {
                keepalive_timeout           10m;
                client_body_timeout         10m;
                send_timeout                10m;
                proxy_read_timeout          10m;
                client_max_body_size        0M;
                proxy_request_buffering off;
                proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
            }

            location ~ ^/(datastore/file/add|datastore/file/add-interactive) {
                keepalive_timeout           10m;
                client_body_timeout         10m;
                send_timeout                10m;
                proxy_read_timeout          10m;
                client_max_body_size        0M;
                proxy_request_buffering off;
                proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
            }

            # iris-next: long timeout for AI endpoints. Multi-pass case summary
            # via long-context extended-reasoning models can take 3-5 minutes;
            # the default 90s proxy_read_timeout returns 504 to the browser
            # while the iris-ng app keeps running and persists the artifact.
            # Covers: every /api/v2/.../ai/* endpoint (case AI features +
            # /api/v2/alerts/<id>/ai/*) and the working-timeline Explain pill.
            # Async AI queue (docs/19 §5b.3) is the long-term fix; this is
            # the transitional bandage until that ships.
            location ~ ^/api/v2/.+/(ai/|working-timeline/events/[^/]+/explain) {
                send_timeout                10m;
                proxy_read_timeout          10m;
                proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
            }
        }

        location /socket.io {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT}/socket.io;
        }

        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}